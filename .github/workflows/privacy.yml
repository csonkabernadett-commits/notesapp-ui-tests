name: Privacy Test Only

on:
  workflow_dispatch:

jobs:
  privacy-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Check runner network location
        shell: bash
        run: |
          echo "=== PUBLIC IP ==="
          curl -s https://api.ipify.org
          echo
          echo "=== IP GEOLOCATION ==="
          curl -s https://ipinfo.io/json    
          

      - name: Run PrivacyTest
        run: mvn -B -Dtest=PrivacyTest test

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-surefire-report
          path: target/surefire-reports
          if-no-files-found: ignore
          
      - name: Upload Privacy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-screenshots
          path: privacy-diagnostics
          if-no-files-found: ignore   